<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Item+</title>

<style>
:root{
  --pistachio:#eaf6df;
  --gold1:#d4af37;
  --gold2:#b38b2a;
  --dark:#1f1f1f;
  --muted:#666;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family: 'Georgia', serif;
  background: var(--pistachio);
  text-align:center;
  color:var(--dark);
}

.container{
  max-width:900px;
  margin:60px auto;
  padding:20px;
}

.logo{
  font-size:64px;
  font-weight:bold;
}

.logo span{
  color:var(--gold1);
}

.tagline{
  margin-top:10px;
  font-size:20px;
  color:var(--muted);
}

.card{
  margin-top:60px;
  background:rgba(255,255,255,.7);
  padding:40px;
  border-radius:28px;
  box-shadow:0 20px 40px rgba(0,0,0,.1);
}

.card h2{
  font-size:36px;
  margin-bottom:15px;
}

.card p{
  font-size:18px;
  margin-bottom:25px;
  color:var(--muted);
}

.btn{
  display:inline-block;
  padding:14px 32px;
  border-radius:40px;
  background:linear-gradient(135deg,var(--gold1),var(--gold2));
  color:white;
  text-decoration:none;
  font-weight:bold;
  font-size:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.2);
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.plans{
  margin-top:70px;
}

.plan-box{
  background:rgba(255,255,255,.6);
  margin:15px 0;
  padding:25px;
  border-radius:20px;
}

.plan-box h3{
  margin-bottom:10px;
}

footer{
  margin-top:60px;
  font-size:14px;
  color:#777;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
Item<span>+</span>
</div>

<div class="tagline">
Mainyk. Derėkis. Uždirbk.
</div>

<div class="card">
<h2>Tapk pirmųjų narių dalimi</h2>
<p>Item+ – mainų platforma su privaloma priemoka. Visada lieki su daiktu ir pinigais.</p>
<a href="#" class="btn">Registruotis į Beta</a>
</div>

<div class="plans">
<h2>Narių tipai</h2>

<div class="plan-box">
<h3>Svečias</h3>
<p>1 nemokamas mainas</p>
</div>

<div class="plan-box">
<h3>Paprastas narys</h3>
<p>Iki 20 daiktų</p>
</div>

<div class="plan-box">
<h3>Premium narys</h3>
<p>Iki 50 daiktų + prioritetas</p>
</div>

</div>

<footer>
© 2026 Item+
</footer>

</div>

</body>
</html>
