<!doctype html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Item+</title>

  <style>
    :root{
      --pist:  #dfeac9;     /* ryškesnė pistacija */
      --pist2: #eff6df;
      --ink:   #171717;
      --muted: #5f5f5f;

      --gold1:#f1d07a;
      --gold2:#d4af37;
      --gold3:#b38b2a;

      --card: rgba(255,255,255,.82);
      --shadow: 0 18px 45px rgba(0,0,0,.12);
      --shadow2: 0 10px 28px rgba(0,0,0,.10);

      --r: 26px;
      --max: 980px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: Georgia, "Times New Roman", serif;
      color:var(--ink);
      background:
        radial-gradient(1100px 650px at 50% -220px, #ffffff 0%, var(--pist2) 55%, #f7f3fb 100%);
    }
    .wrap{
      max-width: var(--max);
      margin: 0 auto;
      padding: 28px 18px 70px;
    }

    /* HERO */
    .hero{
      background: linear-gradient(180deg, var(--pist) 0%, #e7f0cf 100%);
      border-radius: var(--r);
      padding: 46px 18px 34px;
      box-shadow: var(--shadow2);
      text-align:center;
      position: relative;
      overflow:hidden;
    }
    .grain{
      position:absolute; inset:0;
      background-image: radial-gradient(rgba(0,0,0,.06) 1px, transparent 1px);
      background-size: 4px 4px;
      opacity:.08;
      pointer-events:none;
      mix-blend-mode:multiply;
    }

    .logo{
      font-size: 64px;
      line-height: 1;
      margin: 0;
      font-weight: 700;
      letter-spacing: .5px;
      display:inline-flex;
      align-items: baseline;
      gap: 6px;
    }
    .logo .word{ color:#3e3e3e; }
    .logo .plus{
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold1), var(--gold2), var(--gold3));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow: 0 6px 18px rgba(180,140,40,.22);
      font-size: 70px;
      position: relative;
      top: -2px;
    }

    .tagline{
      margin: 14px auto 16px;
      max-width: 620px;
      color:#3f3f3f;
      font-size: 18px;
    }

    /* TOP RIGHT "Registruokis" */
    .corner-cta{
      position:absolute;
      top: 16px;
      right: 16px;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 12px 18px;
      border-radius: 999px;
      text-decoration:none;
      font-weight: 800;
      color:#fff;
      background: linear-gradient(180deg, #e0c06a 0%, #caa24c 45%, #b38b2a 100%);
      box-shadow: 0 14px 30px rgba(170, 130, 40, .28);
      border: 1px solid rgba(255,255,255,.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      white-space: nowrap;
    }
    .corner-cta .pluschip{
      width: 28px; height: 28px;
      border-radius: 999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background: rgba(255,255,255,.22);
      border: 1px solid rgba(255,255,255,.30);
      font-size: 18px;
      line-height: 1;
    }
    .corner-cta .sale{
      margin-left: 2px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .2px;
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.22);
    }

    /* TABS */
    .tabs{
      margin: 22px auto 0;
      max-width: 860px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap: 34px;
      font-size: 20px;
      white-space: nowrap;
    }
    .tab{
      text-align:center;
      display:inline-block;
      padding: 10px 6px;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      user-select:none;
      color:#2f2f2f;
    }
    .tab.active{
      color:#1f1f1f;
      border-color: rgba(202,162,76,.85);
    }

    /* PREMIUM */
    .premium{
      max-width: 860px;
      margin: 22px auto 0;
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 22px;
      overflow:hidden;
      box-shadow: var(--shadow2);
      text-align:center;
      padding: 26px 18px 20px;
    }
    .premium h2{
      margin: 0 0 10px;
      font-size: 46px;
      color:#2b2b2b;
      letter-spacing: .2px;
    }
    .premium p{
      margin: 0 auto 18px;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.45;
      max-width: 720px;
    }
    .premium .img{
      margin: 14px auto 18px;
      max-width: 820px;
      border-radius: 18px;
      overflow:hidden;
      background: linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,0));
      border: 1px solid rgba(0,0,0,.06);
    }
    .premium .img img{
      width:100%;
      height: auto;
      display:block;
    }
    .btn-soft{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 12px 26px;
      border-radius: 999px;
      text-decoration:none;
      font-weight: 800;
      color:#fff;
      background: linear-gradient(180deg, #d2b25a 0%, #b88a2f 100%);
      box-shadow: 0 12px 22px rgba(160,120,40,.22);
      border: 1px solid rgba(255,255,255,.30);
    }

    /* CATEGORY CARDS */
    .grid{
      max-width: 860px;
      margin: 18px auto 0;
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .cat{
      background: var(--card);
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 18px;
      overflow:hidden;
      box-shadow: var(--shadow2);
      text-decoration:none;
      color: inherit;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .cat:hover{ transform: translateY(-2px); box-shadow: var(--shadow); }
    .cat .img{
      height: 150px;
      background: linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,0));
      position: relative;
    }
    .cat .img img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }
    .cat .label{
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
      padding: 14px 14px 16px;
      font-weight: 800;
      font-size: 28px;
      color:#4a4a4a;
    }
    .icon{
      width: 24px; height: 24px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius: 999px;
      background: rgba(202,162,76,.16);
      color: #8a6a1f;
      font-size: 14px;
      line-height: 1;
    }

    .bottom-fade{
      margin: 26px auto 0;
      max-width: 860px;
      height: 70px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(223,234,201,.60) 0%, rgba(255,255,255,0) 100%);
    }

    /* Responsive */
    @media (max-width: 860px){
      .logo{ font-size: 54px; }
      .logo .plus{ font-size: 60px; }

      .corner-cta{ top: 12px; right: 12px; padding: 10px 14px; }
      .tabs{
        justify-content: flex-start;
        overflow-x: auto;
        gap: 22px;
        padding: 0 6px;
        scroll-snap-type: x mandatory;
      }
      .tab{ scroll-snap-align: start; }

      /* kortelės telefone - iš kairės į dešinę (slenka) */
      .grid{
        display:flex;
        overflow-x:auto;
        gap: 14px;
        scroll-snap-type: x mandatory;
        padding: 0 6px;
      }
      .cat{
        flex: 0 0 85%;
        scroll-snap-align: start;
      }
      .cat .label{ font-size: 26px; }
      .premium h2{ font-size: 40px; }
      .premium p{ font-size: 18px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <section class="hero">
      <div class="grain"></div>

      <a class="corner-cta" href="#registracija" aria-label="Registruokis">
        <span class="pluschip">+</span>
        Registruokis
        <span class="sale">SALE</span>
      </a>

      <h1 class="logo">
        <span class="word">Item</span><span class="plus">+</span>
      </h1>

      <div class="tagline">Mainyk. Derėkis. Uždirbk.</div>

      <div class="tabs" aria-label="Kategorijos">
        <div class="tab active">Moterims</div>
        <div class="tab">Vyrams</div>
        <div class="tab">Vaikams</div>
        <div class="tab">Senjorams</div>
      </div>

      <div class="premium" id="premium">
        <h2>Premium mainai</h2>
        <p>Vardiniai rūbai, avalynė ir aksesuarai mainams su priemoka.</p>

        <div class="img">
          <!-- Įkelk paveikslą į repo: /assets/premium.jpg -->
          <img src="assets/premium.jpg" alt="Premium mainai" onerror="this.style.display='none'">
        </div>

        <a class="btn-soft" href="#premium">Įeiti į Premium</a>
      </div>

      <div class="grid">
        <a class="cat" href="#rubai">
          <div class="img">
            <!-- Įkelk paveikslą: /assets/rubai.jpg -->
            <img src="assets/rubai.jpg" alt="Rūbai" onerror="this.style.display='none'">
          </div>
          <div class="label"><span class="icon">👗</span> Rūbai</div>
        </a>

        <a class="cat" href="#avalyne">
          <div class="img">
            <!-- Įkelk paveikslą: /assets/avalyne.jpg -->
            <img src="assets/avalyne.jpg" alt="Avalynė" onerror="this.style.display='none'">
          </div>
          <div class="label"><span class="icon">👟</span> Avalynė</div>
        </a>

        <a class="cat" href="#aksesuarai">
          <div class="img">
            <!-- Įkelk paveikslą: /assets/aksesuarai.jpg -->
            <img src="assets/aksesuarai.jpg" alt="Aksesuarai" onerror="this.style.display='none'">
          </div>
          <div class="label"><span class="icon">💍</span> Aksesuarai</div>
        </a>
      </div>

      <div class="bottom-fade"></div>
    </section>
  </div>
</body>
</html>
